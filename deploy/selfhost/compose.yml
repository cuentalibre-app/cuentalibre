# Self-hosted cuentalibre: one image serves the web app and the API on port 3000,
# next to Postgres. HTTPS is left to whatever already reaches your services
# (Cloudflare Tunnel, Tailscale, a reverse proxy). See https://cuentalibre.es/docs/instalar
#
#   cp .env.example .env    # then fill it in
#   docker compose up -d --build

services:
  cuentalibre:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: cuentalibre
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # The container always listens here; PORT in .env only picks the host port
      PORT: "3000"
      DATABASE_URL: postgres://cuentalibre:${POSTGRES_PASSWORD}@postgres:5432/cuentalibre
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - files:/app/data/files
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cuentalibre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cuentalibre
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuentalibre"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  files:
  postgres:
