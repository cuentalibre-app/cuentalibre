#cloud-config
# Paste into "Cloud config" when creating the server (Ubuntu 24.04).
# It creates the `deploy` user with the SSH keys chosen in the console, turns off
# password and root logins, enables automatic security updates and installs Docker
# and the tools for encrypted backups.
# The Hetzner Cloud Firewall in front of it only allows 22: HTTP comes through the Cloudflare Tunnel.

users:
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true

package_update: true
package_upgrade: true
packages:
  - unattended-upgrades
  - ufw
  - age
  - python3-boto3

write_files:
  - path: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  # The console's keys go to root; move them to `deploy`.
  - mkdir -p /home/deploy/.ssh
  - cp /root/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys
  - chown -R deploy:deploy /home/deploy/.ssh
  - chmod 700 /home/deploy/.ssh && chmod 600 /home/deploy/.ssh/authorized_keys
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker deploy
  - ufw default deny incoming
  - ufw allow 22/tcp
  - ufw --force enable
  - mkdir -p /opt/cuentalibre && chown -R deploy:deploy /opt/cuentalibre
  - systemctl restart ssh
