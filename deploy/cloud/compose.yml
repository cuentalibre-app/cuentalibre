# cuentalibre Cloud: a Cloudflare Tunnel, the API and Postgres on one server.
# Production and staging each run it on their own server, with their own `.env`.
# The tunnel connects out to Cloudflare, so the server opens no port for HTTP.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - api
    logging: *logging

  api:
    image: ${API_IMAGE:-ghcr.io/jesuspb2/cuentalibre-api:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://cuentalibre:${POSTGRES_PASSWORD}@postgres:5432/cuentalibre
      BETTER_AUTH_URL: https://${API_DOMAIN}
      # Cloudflare sets it to the client's address; nothing else can reach the API.
      CLIENT_IP_HEADER: cf-connecting-ip
    volumes:
      - files:/app/data/files
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cuentalibre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cuentalibre
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuentalibre"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

volumes:
  files:
  postgres:
