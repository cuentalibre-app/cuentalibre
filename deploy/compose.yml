# cuentalibre Cloud: Caddy (TLS), the API and Postgres on one server, and a staging
# copy of the API and Postgres next to them, with their own data and settings.
# Copy this folder to the server, fill in `.env` from `.env.example`, put the
# Cloudflare origin certificates in `certs/`, then `docker compose up -d`.
# CI writes `.env.staging` and `.env.staging-postgres`, and tags the image staging runs as `cuentalibre-api:staging`.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      STAGING_API_DOMAIN: ${STAGING_API_DOMAIN:-staging.api.cuentalibre.es}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./origin-pull-ca.pem:/etc/caddy/origin-pull-ca.pem:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
    depends_on:
      - api
    logging: *logging

  api:
    image: ${API_IMAGE:-ghcr.io/jesuspb2/cuentalibre-api:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://cuentalibre:${POSTGRES_PASSWORD}@postgres:5432/cuentalibre
      BETTER_AUTH_URL: https://${API_DOMAIN}
    volumes:
      - files:/app/data/files
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cuentalibre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cuentalibre
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuentalibre"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  api-staging:
    image: cuentalibre-api:staging
    restart: unless-stopped
    # Optional, so the production services still start on a server without staging
    env_file: [{ path: .env.staging, required: false }]
    environment:
      NODE_ENV: production
    volumes:
      - files-staging:/app/data/files
    depends_on:
      postgres-staging:
        condition: service_healthy
    logging: *logging

  postgres-staging:
    image: postgres:18-alpine
    restart: unless-stopped
    # Just POSTGRES_PASSWORD, apart from the API's settings
    env_file: [{ path: .env.staging-postgres, required: false }]
    environment:
      POSTGRES_USER: cuentalibre
      POSTGRES_DB: cuentalibre
    volumes:
      - postgres-staging:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuentalibre"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

volumes:
  caddy-data:
  files:
  postgres:
  files-staging:
  postgres-staging:
