name: Promote to production

# Sends what runs on staging to production, and tags the commit `prod-<app>-<date>`.
# Run from `main` to promote; run from an older `prod-*` tag to roll back to it.
on:
  workflow_dispatch:
    inputs:
      api:
        description: API
        type: boolean
        default: true
      web:
        description: Web app
        type: boolean
        default: true

permissions:
  contents: write # the tags
  actions: read # whether CI passed

jobs:
  promote-api:
    if: inputs.api
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-api
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # From main, the image staging runs, as it is; from a tag, that commit's image.
      - name: Find the image
        id: image
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            revision=$(ssh "deploy@$DEPLOY_HOST" "docker image inspect cuentalibre-api:staging -f '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}'")
          else
            revision=$GITHUB_SHA
          fi
          [ -n "$revision" ] || { echo "Staging runs no image to promote" >&2; exit 1; }
          echo "revision=$revision" | tee -a "$GITHUB_OUTPUT"
          if ssh "deploy@$DEPLOY_HOST" "docker image inspect cuentalibre-api:$revision" >/dev/null; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      # Images go after a week on the server; rolling back further builds the tag again.
      - name: Rebuild an image the server no longer has
        if: steps.image.outputs.missing == 'true'
        env:
          REVISION: ${{ steps.image.outputs.revision }}
        run: |
          git checkout "$REVISION"
          docker build -f apps/api/Dockerfile --target api --build-arg SENTRY_RELEASE="$REVISION" \
            --label org.opencontainers.image.revision="$REVISION" -t "cuentalibre-api:$REVISION" .
          docker save "cuentalibre-api:$REVISION" | gzip | ssh "deploy@$DEPLOY_HOST" 'gunzip | docker load'
      # The server config is main's, sent by the staging deploy; production only changes image.
      - name: Restart the API
        env:
          IMAGE: cuentalibre-api:${{ steps.image.outputs.revision }}
        run: |
          ssh "deploy@$DEPLOY_HOST" "cd /opt/cuentalibre \
            && sed -i 's|^API_IMAGE=.*|API_IMAGE=$IMAGE|' .env \
            && docker compose up -d --no-deps api"
      - name: Check it answers
        run: |
          for i in $(seq 1 30); do
            curl -fsS https://api.cuentalibre.es/v1/health && exit 0
            sleep 2
          done
          ssh "deploy@$DEPLOY_HOST" 'cd /opt/cuentalibre && docker compose logs --tail 50 api'
          exit 1
      - name: Tag what runs in production
        env:
          REVISION: ${{ steps.image.outputs.revision }}
        run: .github/scripts/tag-release.sh api "$REVISION"

  # After the API, so the app never calls endpoints that aren't live yet
  promote-web:
    needs: promote-api
    if: ${{ !cancelled() && inputs.web && contains(fromJSON('["success", "skipped"]'), needs.promote-api.result) }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      # Every merge deploys the app to staging, so main's last commit is what staging shows,
      # as long as its CI run got that far.
      - name: Check staging runs this commit
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --json conclusion --jq '.[0].conclusion')
          [ "$conclusion" = success ] || { echo "CI on $GITHUB_SHA is '${conclusion:-not run}', so staging may not show it yet" >&2; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The API's address is baked into the build, so production builds its own
      - run: pnpm exec turbo run build --filter=@cuentalibre/web
        env:
          VITE_API_URL: https://api.cuentalibre.es
          VITE_SITE_URL: https://cuentalibre.es
      - name: Deploy the app to Cloudflare
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy
      - name: Tag what runs in production
        run: .github/scripts/tag-release.sh web "$GITHUB_SHA"
