name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.affected.outputs.api }}
      web: ${{ steps.affected.outputs.web }}
      site: ${{ steps.affected.outputs.site }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cuentalibre
          POSTGRES_PASSWORD: cuentalibre
          POSTGRES_DB: cuentalibre
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cuentalibre"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://cuentalibre:cuentalibre@localhost:5432/cuentalibre_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # turbo needs the history back to the previous push to tell what changed
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known vulnerabilities in what ships; advisories to skip go in pnpm-workspace.yaml (auditConfig)
      - run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          SITE_URL: https://cuentalibre.es
          PUBLIC_APP_URL: https://app.cuentalibre.es
          VITE_API_URL: https://api.cuentalibre.es
          VITE_SITE_URL: https://cuentalibre.es
          # The owner shown on the legal pages, kept out of the repository
          PUBLIC_OWNER_NAME: ${{ secrets.OWNER_NAME }}
          PUBLIC_OWNER_TAX_ID: ${{ secrets.OWNER_TAX_ID }}
          PUBLIC_OWNER_ADDRESS: ${{ secrets.OWNER_ADDRESS }}
          PUBLIC_OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      - name: Check the migrations match the schema
        run: |
          pnpm --filter @cuentalibre/api db:generate
          git diff --exit-code --stat -- apps/api/drizzle
          test -z "$(git status --porcelain -- apps/api/drizzle)"
      - name: Find the apps to deploy
        id: affected
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TURBO_SCM_BASE: ${{ github.event.before }}
        run: |
          affected=$(pnpm exec turbo ls --affected --output=json | jq -r '.packages.items[].name')
          for app in api web site; do
            changed=false
            grep -qx "@cuentalibre/$app" <<<"$affected" && changed=true
            # The server config lives outside any package; a diff that fails counts as a change
            if [ "$app" = api ] && ! git diff --quiet "$TURBO_SCM_BASE" HEAD -- deploy; then changed=true; fi
            echo "$app=$changed" | tee -a "$GITHUB_OUTPUT"
          done
      - name: Keep the site build for the deploy job
        if: steps.affected.outputs.site == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: apps/site/dist
          retention-days: 1

  # Every merge goes to staging first; production only takes what the promote workflow sends it.
  deploy-staging-api:
    needs: check
    if: needs.check.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging-api
      cancel-in-progress: false
    env:
      IMAGE: cuentalibre-api:${{ github.sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write the staging settings
        env:
          SETTINGS: ${{ toJSON(vars) }}
          SECRETS: ${{ toJSON(secrets) }}
        run: deploy/server-env.sh staging "$RUNNER_TEMP/staging" "$IMAGE"
      # The revision label tells the promote workflow which commit staging runs.
      - name: Build the API image
        run: |
          docker build -f apps/api/Dockerfile --target api --build-arg SENTRY_RELEASE=${{ github.sha }} \
            --label org.opencontainers.image.revision=${{ github.sha }} -t "$IMAGE" .
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # The image goes over SSH, so the server needs no registry credentials.
      - name: Send the image, the server config and the staging settings
        run: |
          docker save "$IMAGE" | gzip | ssh "deploy@$DEPLOY_HOST" 'gunzip | docker load'
          scp deploy/compose.yml deploy/Caddyfile deploy/origin-pull-ca.pem deploy/backup.sh deploy/backup-recipients.txt "deploy@$DEPLOY_HOST:/opt/cuentalibre/"
          # .env, and backup.env when staging has a backups bucket
          find "$RUNNER_TEMP/staging" -type f -exec scp -p {} "deploy@$DEPLOY_HOST:/opt/cuentalibre/" \;
          rm -r "$RUNNER_TEMP/staging"
          ssh "deploy@$DEPLOY_HOST" 'command -v age >/dev/null || { sudo apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q age; }'
      # Staging has a server of its own, so the whole stack restarts as production's would.
      - name: Restart the API
        run: |
          ssh "deploy@$DEPLOY_HOST" "cd /opt/cuentalibre \
            && docker compose up -d --remove-orphans \
            && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile \
            && docker image prune -af --filter 'until=168h'"
      - name: Check it answers
        run: |
          for i in $(seq 1 30); do
            curl -fsS https://${{ vars.API_DOMAIN }}/v1/health && exit 0
            sleep 2
          done
          ssh "deploy@$DEPLOY_HOST" 'cd /opt/cuentalibre && docker compose logs --tail 50 api'
          exit 1
      - name: Seed an empty database
        run: ssh "deploy@$DEPLOY_HOST" 'cd /opt/cuentalibre && docker compose exec -T api node dist/db/seed-cli.js'

  # After the API, so the app never calls endpoints that aren't live yet
  deploy-staging-web:
    needs: [check, deploy-staging-api]
    if: ${{ !cancelled() && needs.check.outputs.web == 'true' && contains(fromJSON('["success", "skipped"]'), needs.deploy-staging-api.result) }}
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The API's address is baked into the build, so staging builds its own
      - run: pnpm exec turbo run build --filter=@cuentalibre/web
        env:
          VITE_API_URL: https://${{ vars.API_DOMAIN }}
          VITE_SITE_URL: https://cuentalibre.es
          VITE_NOINDEX: "true"
      - name: Deploy the app to Cloudflare
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy --env staging

  # The site has no staging: it goes straight to production.
  deploy-site:
    needs: check
    if: needs.check.outputs.site == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist
      - name: Deploy the site to Cloudflare
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy
