name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cuentalibre
          POSTGRES_PASSWORD: cuentalibre
          POSTGRES_DB: cuentalibre
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cuentalibre"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://cuentalibre:cuentalibre@localhost:5432/cuentalibre_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          SITE_URL: https://cuentalibre.es
          PUBLIC_APP_URL: https://app.cuentalibre.es
      - name: Check the migrations match the schema
        run: |
          pnpm --filter @cuentalibre/api db:generate
          git diff --exit-code --stat -- apps/api/drizzle
          test -z "$(git status --porcelain -- apps/api/drizzle)"
      - name: Keep the site build for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
          retention-days: 1
      - name: Keep the app build for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: Deploy the site and the app to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          (cd apps/site && npx --yes wrangler@4.145.0 deploy)
          (cd apps/web && npx --yes wrangler@4.145.0 deploy)
