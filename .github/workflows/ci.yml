name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cuentalibre
          POSTGRES_PASSWORD: cuentalibre
          POSTGRES_DB: cuentalibre
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cuentalibre"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://cuentalibre:cuentalibre@localhost:5432/cuentalibre_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known vulnerabilities in what ships; advisories to skip go in pnpm-workspace.yaml (auditConfig)
      - run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          SITE_URL: https://cuentalibre.es
          PUBLIC_APP_URL: https://app.cuentalibre.es
          VITE_API_URL: https://api.cuentalibre.es
          VITE_SITE_URL: https://cuentalibre.es
          # The owner shown on the legal pages, kept out of the repository
          PUBLIC_OWNER_NAME: ${{ vars.OWNER_NAME }}
          PUBLIC_OWNER_TAX_ID: ${{ vars.OWNER_TAX_ID }}
          PUBLIC_OWNER_ADDRESS: ${{ vars.OWNER_ADDRESS }}
          PUBLIC_OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
      - name: Check the migrations match the schema
        run: |
          pnpm --filter @cuentalibre/api db:generate
          git diff --exit-code --stat -- apps/api/drizzle
          test -z "$(git status --porcelain -- apps/api/drizzle)"
      - name: Keep the site build for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-dist
          path: apps/site/dist
          retention-days: 1
      - name: Keep the app build for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  deploy-api:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-api
      cancel-in-progress: false
    env:
      IMAGE: cuentalibre-api:${{ github.sha }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build the API image
        run: docker build -f apps/api/Dockerfile --target api --build-arg SENTRY_RELEASE=${{ github.sha }} -t "$IMAGE" .
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # The image goes over SSH, so the server needs no registry credentials.
      - name: Send the image and the server config
        run: |
          docker save "$IMAGE" | gzip | ssh "deploy@$DEPLOY_HOST" 'gunzip | docker load'
          scp deploy/compose.yml deploy/Caddyfile deploy/backup.sh "deploy@$DEPLOY_HOST:/opt/cuentalibre/"
      - name: Restart the API
        run: |
          ssh "deploy@$DEPLOY_HOST" "cd /opt/cuentalibre \
            && sed -i 's|^API_IMAGE=.*|API_IMAGE=$IMAGE|' .env \
            && docker compose up -d --remove-orphans \
            && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile \
            && docker image prune -af --filter 'until=168h'"
      - name: Check it answers
        run: |
          for i in $(seq 1 30); do
            curl -fsS https://api.cuentalibre.es/v1/health && exit 0
            sleep 2
          done
          ssh "deploy@$DEPLOY_HOST" 'cd /opt/cuentalibre && docker compose logs --tail 50 api'
          exit 1

  deploy:
    needs: [check, deploy-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-dist
          path: apps/site/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: apps/web/dist
      - name: Deploy the site and the app to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          (cd apps/site && npx --yes wrangler@4.145.0 deploy)
          (cd apps/web && npx --yes wrangler@4.145.0 deploy)
