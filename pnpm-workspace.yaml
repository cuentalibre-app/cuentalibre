packages:
  - "apps/*"
  - "packages/*"

# Don't install versions published less than 14 days ago (mitigates supply-chain attacks)
minimumReleaseAge: 20160

# Skip install scripts we don't need: esbuild ships its binary as an optional dependency, core-js only prints a banner
allowBuilds:
  core-js: false
  esbuild: false

auditConfig:
  ignoreGhsas:
    # picomatch, through the site's build tooling (astro, vite), only matches our own globs while
    # the site builds. No patched version yet; drop this once one installs (from 2026-11-17).
    - GHSA-fc5q-39xc-vjpf
