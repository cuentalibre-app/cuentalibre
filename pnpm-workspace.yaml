packages:
  - "apps/*"
  - "packages/*"

# Don't install versions published less than 14 days ago (mitigates supply-chain attacks)
minimumReleaseAge: 20160

# Skip install scripts we don't need: esbuild ships its binary as an optional dependency, core-js only prints a banner
allowBuilds:
  core-js: false
  esbuild: false

auditConfig:
  ignoreGhsas:
    # undici, through astro > unifont, only fetches fonts while the site builds. The fix
    # (8.12.2) is younger than minimumReleaseAge; drop this once it installs (from 2026-10-29).
    - GHSA-xjj6-f33q-929c
