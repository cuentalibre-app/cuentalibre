# Local development database. Start it with `docker compose up -d`.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cuentalibre
      POSTGRES_PASSWORD: cuentalibre
      POSTGRES_DB: cuentalibre
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuentalibre"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres:
